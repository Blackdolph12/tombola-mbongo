<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tia Muke Zwa Ebele</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;padding:15px;margin:0}
.card{background:white;padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-size:16px;font-weight:bold;margin-top:10px}
.btn-y{background:#ffcc00;color:#000}
.btn-g{background:#0d2a54;color:white}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box;font-size:15px}
label{font-weight:bold;font-size:14px;margin-top:8px;display:block}
h2{color:#0d2a54;text-align:center}
h3{margin-top:0;color:#0d2a54}
</style>
</head>
<body>

<h2>Tia Muke Zwa Ebele 🇨🇩</h2>

<div class="card">
<h3>📱 Buy Airtime</h3>
<label>Network</label>
<select id="net">
<option>Vodacom DRC</option>
<option>Airtel DRC</option>
<option>Orange DRC</option>
<option>Africell</option>
</select>
<label style="margin-top:8px">Phone</label>
<input id="phone" placeholder="+243..." />
<label style="margin-top:8px">Amount R</label>
<input id="amount" type="number" placeholder="100" />
<button class="btn btn-y" onclick="return goAirtime()">BUY AIRTIME</button>
</div>

<div class="card">
<h3>💸 Send Money SA</h3>
<label>Recipient Phone</label>
<input id="recv" placeholder="082..." />
<label style="margin-top:8px">Amount R</label>
<input id="sendamt" type="number" placeholder="500" />
<button class="btn btn-y" onclick="return goMoney()">SEND MONEY</button>
</div>

<div class="card" style="border:2px solid green;background:#f0fff0">
<h3>🇨🇩 Send to Congo TODAY - Real Money</h3>
<label>Mama Phone DRC</label>
<input id="mamaPhone" placeholder="+243815..." />
<label style="margin-top:8px">Amount in Rands</label>
<input id="congoAmount" type="number" placeholder="1000" />
<label style="margin-top:8px">Receive Method</label>
<select id="method">
<option>Airtel Money DRC</option>
<option>Vodacom M-Pesa DRC</option>
<option>Orange Money</option>
<option>Cash Pickup</option>
</select>
<button class="btn btn-g" onclick="return goCongo()">🇨🇩 SEND TO CONGO NOW</button>
<p style="font-size:12px;color:green;margin-top:8px">✅ Mama gets $ in 10 mins via Airtel/Vodacom</p>
</div>

<script>
var MY_NUMBER="27754665536"; // PUT YOUR WHATSAPP NUMBER HERE 27... no +

function goAirtime(){
var net=document.getElementById('net').value;
var ph=document.getElementById('phone').value;
var am=document.getElementById('amount').value;
if(!ph||!am){alert("Enter phone and amount");return false;}
var msg="Hi Tia Muke! Buy Airtime: "+net+" - Phone: "+ph+" - Amount: R"+am;
window.location.href="https://wa.me/"+MY_NUMBER+"?text="+encodeURIComponent(msg);
return false;
}

function goMoney(){
var recv=document.getElementById('recv').value;
var amt=document.getElementById('sendamt').value;
if(!recv||!amt){alert("Enter recipient and amount");return false;}
var msg="Hi Tia Muke! Send Money: To "+recv+" - Amount: R"+amt;
window.location.href="https://wa.me/"+MY_NUMBER+"?text="+encodeURIComponent(msg);
return false;
}

function goCongo(){
var mama=document.getElementById('mamaPhone').value;
var amt=document.getElementById('congoAmount').value;
var method=document.getElementById('method').value;
if(!mama||!amt){alert("Enter mama phone and amount");return false;}
var orderID="TIA"+Date.now();
var usd=(amt/19.5).toFixed(2);
var msg="🇨🇩 CONGO ORDER "+orderID+" - To: "+mama+" - R"+amt+" ($"+usd+") - Method: "+method+" - Capitec Ref: "+orderID+" - Client will EFT now";
window.location.href="https://wa.me/"+MY_NUMBER+"?text="+encodeURIComponent(msg);
return false;
}
</script>

</body>
</html>
