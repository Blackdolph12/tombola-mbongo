<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOMBOLA MBONGO</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;margin:0;padding:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#1e293b;border-radius:15px;padding:20px;text-align:center;border:1px solid #334155}
.btn{background:#3b82f6;color:white;border:none;padding:10px 15px;border-radius:8px;width:100%;margin-top:10px;font-weight:bold;cursor:pointer}
.page{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#0f172a;padding:20px;box-sizing:border-box;overflow:auto;z-index:99}
.input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;box-sizing:border-box}
.btn-green{background:#22c55e} .btn-back{background:#475569;margin-bottom:15px}
h1{text-align:center}
</style></head><body>

<div id="home">
<div style="text-align:center;padding:15px"><h1>🎰 TOMBOLA MBONGO</h1><p>Services Rapides DRC</p></div>
<div class="grid">
<div class="card"><div style="font-size:40px">🎟️</div><h3>LOTTERY</h3><p style="color:#22c55e">Jackpot 50.000 FC</p><button class="btn" onclick="openPage('lottery')">PLAY</button></div>
<div class="card"><div style="font-size:40px">💳</div><h3>AIRTIME</h3><p style="color:#22c55e">Vodacom - Airtel</p><button class="btn" onclick="openPage('airtime')">BUY</button></div>
<div class="card"><div style="font-size:40px">💡</div><h3>ELECTRICITE</h3><p style="color:#22c55e">SNEL Prepayé</p><button class="btn" onclick="openPage('snel')">PAYER</button></div>
<div class="card"><div style="font-size:40px">📺</div><h3>CANAL+</h3><p style="color:#22c55e">Decoder</p><button class="btn" onclick="openPage('canal')">RENEW</button></div>
</div>
</div>

<!-- LOTTERY PAGE -->
<div id="lottery" class="page">
<button class="btn btn-back" onclick="goHome()">← RETOUR</button>
<h1>🎰 LOTTERY TOMBOLA</h1>
<div style="background:#1e293b;padding:20px;border-radius:15px;text-align:center;margin-top:20px">
<h2>Jackpot: 50,000 FC</h2>
<p>Ticket: 2,000 FC</p>
<input class="input" id="lotNum" placeholder="Choisissez 1 numéro (1-20)" type="number">
<button class="btn btn-green" onclick="playLottery()">🎲 TIRER AU SORT - 2,000 FC</button>
<h2 id="lotResult" style="margin-top:20px"></h2>
<button class="btn" style="background:#eab308;color:black" onclick="payMpesa('Lottery 2000FC')">PAYER AVEC M-PESA</button>
</div></div>

<!-- AIRTIME PAGE -->
<div id="airtime" class="page">
<button class="btn btn-back" onclick="goHome()">← RETOUR</button>
<h1>💳 ACHAT AIRTIME</h1>
<div style="background:#1e293b;padding:20px;border-radius:15px;margin-top:20px">
<select class="input"><option>Vodacom</option><option>Airtel</option><option>Orange</option><option>Africell</option></select>
<input class="input" placeholder="Numéro (ex: 081...)" >
<input class="input" placeholder="Montant (ex: 5000 FC)" type="number">
<button class="btn btn-green" onclick="payMpesa('Airtime')">PAYER AVEC M-PESA DRC</button>
<p style="text-align:center;margin-top:10px;font-size:13px;color:#94a3b8">Paiement sécurisé M-Pesa / Airtel Money</p>
</div></div>

<!-- SNEL PAGE -->
<div id="snel" class="page">
<button class="btn btn-back" onclick="goHome()">← RETOUR</button>
<h1>💡 SNEL ELECTRICITE</h1>
<div style="background:#1e293b;padding:20px;border-radius:15px;margin-top:20px">
<input class="input" placeholder="Numéro Compteur SNEL">
<input class="input" placeholder="Montant FC" type="number">
<button class="btn btn-green" onclick="payMpesa('SNEL')">PAYER FACTURE SNEL</button>
</div></div>

<!-- CANAL PAGE -->
<div id="canal" class="page">
<button class="btn btn-back" onclick="goHome()">← RETOUR</button>
<h1>📺 CANAL+ DRC</h1>
<div style="background:#1e293b;padding:20px;border-radius:15px;margin-top:20px">
<input class="input" placeholder="Numéro Décodeur">
<select class="input"><option>Access - 5000 FC</option><option>Evasion - 12000 FC</option><option>Essentiel - 25000 FC</option><option>Tout Canal - 45000 FC</option></select>
<button class="btn btn-green" onclick="payMpesa('Canal+')">RENOUVELER CANAL+</button>
</div></div>

<script>
function openPage(id){document.getElementById('home').style.display='none';document.getElementById(id).style.display='block';}
function goHome(){document.querySelectorAll('.page').forEach(p=>p.style.display='none');document.getElementById('home').style.display='block';}
function playLottery(){
let n=document.getElementById('lotNum').value;
let win=Math.floor(Math.random()*20)+1;
if(!n){alert('Entrez un numéro!');return}
if(n==win){document.getElementById('lotResult').innerHTML='🎉 GAGNÉ! Numéro '+win+' - Vous gagnez 50,000 FC!';}
else{document.getElementById('lotResult').innerHTML='😢 Perdu! Tirage: '+win+' - Essayez encore!';}
}
function payMpesa(service){alert('✅ Redirection M-PESA DRC\n\nService: '+service+'\n\nNuméro Marchand TOMBOLA MBONGO: *422*... \n\nIntégration API M-Pesa à connecter par vous');}
</script>
</body></html>
