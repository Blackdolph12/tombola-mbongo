<!DOCTYPE html><html lang="fr"><head><link rel="apple-touch-icon" href="9b7ffd56-a935-4a43-3c2c-b36a032378f3.jpeg"><link rel="icon" href="9b7ffd56-a935-4a43-3c2c-b36a032378f3.jpeg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOMBOLA MBONGO</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:sans-serif;background:#eef2f7;padding-bottom:90px}.header{background:#0033AB;color:#fff;padding:22px 18px;border-radius:0 0 22px 22px;display:flex;gap:12px;align-items:center}.card{background:#fff;border-radius:16px;padding:16px;margin:12px;box-shadow:0 4px 18px rgba(0,51,171,.08)}.balance{font-size:38px;font-weight:900;color:#0033AB}.input{width:100%;border:1.5px solid #cbd5e1;border-radius:10px;padding:11px;margin-top:8px}.btn{width:100%;border:none;border-radius:10px;padding:13px;font-weight:800;margin-top:12px}.btn-yellow{background:#FFCC00}.btn-blue{background:#0033AB;color:#fff}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #e2e8f0}</style></head><body><div class="header"><h1>TOMBOLA MBONGO</h1></div><div class="card"><div>💼 SOLDE DISPONIBLE</div><div class="balance" id="soldeText">4000 CDF</div><div style="display:flex;gap:8px"><input id="rechargeInput" class="input" type="number" placeholder="+ Montant"><button class="btn btn-yellow" style="width:auto" onclick="recharger()">Recharger</button></div></div><div class="card"><b>👥 CREER GROUPE</b><input id="nomGroupe" class="input" value="Mama Gombe"><input id="miseGroupe" class="input" type="number" value="1000"><button class="btn btn-yellow" onclick="creerGroupe()">+ Creer Tombola</button></div><div class="card"><b>Groupe: <span id="gName">Mama Gombe</span></b><div id="potText" style="font-size:18px;font-weight:900">1000 CDF x 5 = 5000 CDF</div><button class="btn btn-blue" onclick="lancerTirage()">🎟️ LANCER TIRAGE</button><div id="winnerBox"></div></div><div class="nav"><div>🏠 Accueil</div><div>👥 Groupes</div><div>🕒 Historique</div><div>👤 Profil</div></div><script>let solde=4000;let groupes=[{nom:"Mama Gombe",mise:1000,membres:["Vous","Mama A","Papa B","Yaya C","Maman L"]}];let lastWinner="Papa B";function render(){document.getElementById('soldeText').innerText=solde+" CDF";if(groupes.length){let g=groupes[0];document.getElementById('gName').innerText=g.nom;document.getElementById('potText').innerText=g.mise+" CDF x "+g.membres.length+" = "+(g.mise*g.membres.length)+" CDF";}if(lastWinner){let g=groupes[0];let pot=g?g.mise*g.membres.length:5000;document.getElementById('winnerBox').innerHTML=`<div style='background:#dcfce7;padding:12px;border-radius:12px;margin-top:12px'><b>🏆 GAGNANT: ${lastWinner} - ${pot} CDF</b></div>`;}}function recharger(){let v=parseInt(document.getElementById('rechargeInput').value);if(!v)return;solde+=v;document.getElementById('rechargeInput').value='';render();}function creerGroupe(){let nom=document.getElementById('nomGroupe').value||'Mama Gombe';let mise=parseInt(document.getElementById('miseGroupe').value)||1000;groupes=[{nom:nom,mise:mise,membres:["Vous","Mama A","Papa B","Yaya C","Maman L"]}];render();}function lancerTirage(){let g=groupes[0];let win=g.membres[Math.floor(Math.random()*g.membres.length)];lastWinner=win;render();}render();</script></body></html>
