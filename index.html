<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOMBOLA MBONGO V5 - Ta Moko, Zwa Ebele</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,-apple-system,sans-serif}
body{background:#eef2f7;min-height:100vh;padding-bottom:100px}
.header{background:#0d2a54;color:white;padding:22px 16px;border-radius:0 0 20px 20px}
.header-top{display:flex;align-items:center;gap:12px}
.voda{width:46px;height:46px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#0d2a54}
.header h1{font-size:21px;font-weight:900}
.card{background:white;margin:14px 12px;border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(13,42,84,.07)}
.solde-val{font-size:44px;font-weight:900;color:#0d2a54;margin-top:8px}
.btn-yellow{width:100%;background:#ffcc00;color:#0d2a54;border:none;padding:15px;border-radius:12px;font-weight:900;margin-top:12px}
.btn-blue{width:100%;background:#0d2a54;color:white;border:none;padding:15px;border-radius:12px;font-weight:900;margin-top:10px;display:flex;justify-content:center;gap:8px}
.btn-green{width:100%;background:#25D366;color:white;border:none;padding:13px;border-radius:12px;font-weight:900;margin-top:10px;display:flex;justify-content:center;gap:8px}
.winner-box{background:#dff7e0;border-radius:14px;padding:14px;margin-top:12px;display:none;border:1.5px solid #b9e6bc}
.winner-box.show{display:block}
.members{display:flex;flex-wrap:wrap;margin:10px 0}
.av{width:36px;height:36px;border-radius:50%;background:#0d2a54;color:white;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid white;margin-left:-6px}
.av:first-child{margin-left:0}.av.me{background:#ffcc00;color:#0d2a54}
.progress{height:6px;background:#eef2f7;border-radius:10px;margin:8px 0;overflow:hidden}
.progress-fill{height:100%;background:#ffcc00;transition:width .4s}
.confetti{position:fixed;top:-10px;width:10px;height:10px;border-radius:2px;animation:fall 3s linear forwards;z-index:100}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #eef2f7;display:flex;justify-content:space-around;padding:10px 0 22px}
</style>
</head>
<body>
<div id="confettiRoot"></div>
<div class="header"><div class="header-top"><div class="voda">₮</div><div><h1>TOMBOLA MBONGO</h1><p>Ta Moko, Zwa Ebele - M-Pesa Ready • <span id="time">19:05</span></p></div></div></div>
<div class="card"><div style="display:flex;justify-content:space-between"><div style="color:#6b7a9a;font-size:11px;font-weight:800">💳 SOLDE DISPONIBLE</div><div style="border:1px solid #d1d9e6;padding:6px 10px;border-radius:10px;font-size:11px;font-weight:700;color:#0d2a54;text-align:center">M-Pesa<br><span style="color:#00b050">● Actif</span></div></div><div class="solde-val" id="solde">4000 CDF</div><div style="font-size:11px;color:#8a9bb5">Tape 2x pour reset · <span id="time2"></span></div><div style="display:flex;gap:8px;margin-top:12px"><input id="rechargeInput" placeholder="Montant M-Pesa" type="number" style="flex:1;padding:13px;border:1.5px solid #e3eaf3;border-radius:12px;font-weight:700"><button onclick="recharge()" style="background:#0d2a54;color:#ffcc00;border:none;padding:13px 20px;border-radius:12px;font-weight:900">+ Recharge</button></div></div>
<div class="card"><div style="color:#6b7a9a;font-size:11px;font-weight:800">👥 CREER GROUPE</div><div style="font-size:12px;font-weight:700;margin:14px 0 6px">Nom du groupe</div><input id="groupName" value="Mama Gombe" style="width:100%;padding:13px;border:1.5px solid #e3eaf3;border-radius:12px;font-weight:700"><div style="font-size:12px;font-weight:700;margin:14px 0 6px">Montant par participant</div><input id="mise" type="number" value="1000" style="width:100%;padding:13px;border:1.5px solid #e3eaf3;border-radius:12px;font-weight:700"><button onclick="creerGroupe()" class="btn-yellow">+ Creer Tombola</button></div>
<div class="card"><div style="font-weight:800">👥 Groupe: <b id="groupNameDisplay">Mama Gombe</b></div><div style="font-size:20px;font-weight:900;color:#0d2a54;margin:8px 0 2px" id="potText">1000 CDF x 1 = 1000 CDF</div><div class="progress"><div class="progress-fill" id="progress" style="width:20%"></div></div><div style="font-size:11px;color:#6b7a9a" id="infoText">1 / 5 participants</div><div class="members" id="membersList"></div><button onclick="participer()" style="width:100%;background:#0d2a54;color:white;border:none;padding:13px;border-radius:12px;font-weight:800;margin:8px 0">Participer - <span id="miseBtn">1000 CDF</span></button><button onclick="lancerTirage()" class="btn-blue">🎟️ LANCER TIRAGE - ZWA EBELE!</button><button onclick="shareWhatsApp()" class="btn-green">📲 Partager sur WhatsApp</button><div class="winner-box" id="winnerBox"><h4>🏆 GAGNANT: <span id="winnerName"></span></h4><div style="font-size:20px;font-weight:900;color:#0d2a54" id="winnerPot"></div><p id="mpesaLog" style="font-size:11px;color:#2d6a30;font-weight:600"></p></div></div>
<div class="nav"><div>🏠<br>Accueil</div><div>👥<br>Groupes</div><div>🕒<br>Historique</div><div>👤<br>Profil</div></div>
<script>
let solde=parseInt(localStorage.getItem('mbongo_solde_v5'))||4000;let membres=JSON.parse(localStorage.getItem('mbongo_membres_v5')||'["Vous"]');let miseVal=1000,maxVal=5;let noms=["Papa B","Maman K","Tonton D","Sœur A","Yaya L","Koko M","Papy J","Mama Gombe"];
function save(){localStorage.setItem('mbongo_solde_v5',solde);localStorage.setItem('mbongo_membres_v5',JSON.stringify(membres));}
function updateUI(){document.getElementById('solde').innerText=solde+' CDF';let pot=miseVal*membres.length;document.getElementById('potText').innerText=miseVal+' CDF x '+membres.length+' = '+pot+' CDF';document.getElementById('membersList').innerHTML=membres.map((m,i)=>`<div class='av ${i==0?'me':''}'>${m[0].toUpperCase()}</div>`).join('');document.getElementById('infoText').innerText=membres.length+' / '+maxVal+' participants';document.getElementById('progress').style.width=(membres.length/maxVal*100)+'%';save();}
function participer(){if(solde<miseVal){alert('Solde insuffisant!');return}if(membres.length>=maxVal){alert('Groupe plein!');return}solde-=miseVal;membres.push(noms[Math.floor(Math.random()*noms.length)]);updateUI();}
function launchConfetti(){let root=document.getElementById('confettiRoot');let colors=['#ffcc00','#0d2a54','#00b050'];for(let i=0;i<50;i++){let c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=colors[Math.floor(Math.random()*colors.length)];root.appendChild(c);setTimeout(()=>c.remove(),3500);}}
function lancerTirage(){if(membres.length<2){alert('Min 2');return}let g=membres[Math.floor(Math.random()*membres.length)],pot=miseVal*membres.length;document.getElementById('winnerName').innerText=g;document.getElementById('winnerPot').innerText=pot+' CDF · ZWA EBELE!';document.getElementById('mpesaLog').innerText='Félicitations! '+pot+' CDF envoyé M-Pesa à '+g+' | TxID: MP'+Math.floor(Math.random()*900000+100000);document.getElementById('winnerBox').classList.add('show');launchConfetti();if(g=='Vous'){solde+=pot;updateUI();}}
function creerGroupe(){let gn=document.getElementById('groupName').value||'Mama Gombe',mv=parseInt(document.getElementById('mise').value)||1000;document.getElementById('groupNameDisplay').innerText=gn;miseVal=mv;membres=["Vous"];document.getElementById('winnerBox').classList.remove('show');updateUI();}
function recharge(){let amt=parseInt(document.getElementById('rechargeInput').value)||0;if(amt<=0)return;solde+=amt;updateUI();alert('M-Pesa: '+amt+' CDF reçu!');}
function shareWhatsApp(){let text=`TOMBOLA MBONGO - Ta Moko, Zwa Ebele! Groupe: ${document.getElementById('groupNameDisplay').innerText} Pot: ${miseVal*maxVal} CDF Rejoins: https://blackdolph12.github.io/tombola-mbongo`;window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');}
function resetApp(){if(confirm('Reset?')){solde=4000;membres=["Vous"];localStorage.clear();updateUI();}}
document.getElementById('solde').addEventListener('dblclick',resetApp);
updateUI();setInterval(()=>{let d=new Date();document.getElementById('time').innerText=d.getHours()+':'+d.getMinutes().toString().padStart(2,'0')},1000);
</script>
</body>
</html>
