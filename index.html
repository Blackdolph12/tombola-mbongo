<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOMBOLA MBONGO</title>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:0}
.header{background:#008751;color:white;padding:15px;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px}
.header img{width:40px;height:40px;border-radius:50%}
.page{display:none;padding:15px;padding-bottom:80px}
.page.active{display:block}
.card{background:white;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.nav{position:fixed;bottom:0;width:100%;background:white;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #ddd}
.nav button{background:none;border:none;font-size:14px}
</style>
</head>
<body>
<div class="header"><img src="9b7ffd56-a935-4a43-3c2c-b36a032378f3.jpeg"><h2>TOMBOLA MBONGO</h2></div>

<div id="accueil" class="page active">
<div class="card"><div>Solde</div><div class="solde" style="font-size:24px;font-weight:bold">0 FC</div></div>
<div class="card"><h3>Prochain Tirage</h3><p>Groupe Mama Gouvernement - 100 FC</p><button onclick="participer()" style="background:#008751;color:white;padding:10px;width:100%;border:none;border-radius:5px">Participer</button></div>
</div>

<div id="groupes" class="page">
<div class="card groupe"><h3>👥 Groupe Mama Gouvernement</h3><p>100 FC - 50 membres - Cagnotte: 4000 FC</p></div>
<div class="card"><h3>+ Créer Nouveau Groupe</h3></div>
<div id="listeGroupes"></div>
</div>

<div id="historique" class="page">
<div class="card"><h3>🕒 Historique</h3><div id="listeHistorique">Aucun historique</div></div>
</div>

<div id="profil" class="page">
<div class="card" style="text-align:center"><img src="9b7ffd56-a935-4a43-3c2c-b36a032378f3.jpeg" style="width:120px;height:120px;border-radius:50%"><h3>TOMBOLA MBONGO</h3><p>Solde: <span class="solde">0 FC</span></p></div>
</div>

<div class="nav">
<button onclick="show('accueil')" id="b-accueil">🏠<br>Accueil</button>
<button onclick="show('groupes')" id="b-groupes">👥<br>Groupes</button>
<button onclick="show('historique')" id="b-historique">🕒<br>Historique</button>
<button onclick="show('profil')" id="b-profil">👤<br>Profil</button>
</div>

<script>
function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active')}
function participer(){alert('Participation enregistrée!')}
</script>
</body>
</html>
