<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tia Muke Zwa Ebele</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,sans-serif;background:#f2f4f7}
#pinScreen{position:fixed;top:0;left:0;right:0;bottom:0;background:#0d2a54;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.pinBox{background:white;border-radius:20px;padding:25px;width:100%;max-width:340px;text-align:center}
.pinInput{font-size:28px;letter-spacing:12px;text-align:center;font-weight:800;padding:14px!important;width:100%;border:2px solid #0d2a54;border-radius:10px}
.header{background:#0d2a54;color:white;padding:18px;text-align:center}
.container{padding:12px;max-width:520px;margin:0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:white;border-radius:14px;padding:14px;box-shadow:0 3px 10px rgba(0,0,0,0.06);text-align:center}
.card-big{grid-column:span 2;text-align:left;border:2px solid #00a651;background:linear-gradient(135deg,#f0fff4,#fff)}
.card h3{margin:6px 0 2px 0;font-size:12px}
.icon{font-size:26px}
.btn{width:100%;padding:11px;border:none;border-radius:10px;font-weight:800;font-size:12px;margin-top:8px;cursor:pointer}
.btn-y{background:#ffcc00;color:#0d2a54}
.btn-b{background:#0d2a54;color:white}
.btn-g{background:#00a651;color:white}
.btn-r{background:#e50914;color:white}
.btn-bl{background:#1a4cff;color:white}
input,select{width:100%;padding:11px;border:1.5px solid #e5e7eb;border-radius:9px;font-size:13px;margin-top:6px;background:#f9fafb}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:20;padding:20px}
.modal-box{background:white;border-radius:16px;padding:18px;max-width:400px;margin:40px auto}
.badge{font-size:8px;background:#00a651;color:white;padding:2px 6px;border-radius:10px}
</style>
</head>
<body>

<div id="pinScreen">
<div class="pinBox">
<div style="font-size:40px">🔒</div>
<h2 style="margin:5px 0;color:#0d2a54">Tia Muke Zwa Ebele</h2>
<p style="font-size:12px;color:#666;margin:0 0 15px 0">Enter PIN to Login<br>0754665536</p>
<input id="pinInput" class="pinInput" type="password" maxlength="4" placeholder="••••" inputmode="numeric" />
<button class="btn btn-b" onclick="checkPin()" style="margin-top:15px;padding:14px;font-size:15px">LOGIN • PIN 1999</button>
<p id="pinMsg" style="font-size:11px;color:red;margin-top:10px;display:none"></p>
</div>
</div>

<div class="header">
<h1>Tia Muke Zwa Ebele 🇨🇩</h1>
<p>0754665536 • <span onclick="logout()" style="text-decoration:underline;cursor:pointer">Logout</span></p>
</div>

<div class="container">
<div class="grid">

<div class="card" onclick="openService('airtime-drc')"><div class="icon">📱</div><h3>Airtime DRC</h3><button class="btn btn-y">Buy</button></div>
<div class="card" onclick="openService('data-drc')"><div class="icon">🌐</div><h3>Data DRC</h3><button class="btn btn-y">Buy</button></div>
<div class="card" onclick="openService('netflix')"><div class="icon">🎬</div><h3>Netflix</h3><button class="btn btn-r">Voucher</button></div>
<div class="card" onclick="openService('1xbet')"><div class="icon">⚽</div><h3>1xBet</h3><button class="btn btn-bl">Voucher</button></div>
<div class="card" onclick="openService('snel')"><div class="icon">💡</div><h3>Electricity</h3><button class="btn btn-y">SNEL</button></div>
<div class="card" onclick="openService('canal')"><div class="icon">📺</div><h3>Canal+</h3><button class="btn btn-y">Pay</button></div>
<div class="card" onclick="openService('money-sa')"><div class="icon">💸</div><h3>Money SA</h3><button class="btn btn-b">Send</button></div>
<div class="card card-big" onclick="openService('congo')"><div style="display:flex;justify-content:space-between"><div><div class="icon">🇨🇩</div><h3>Send to Congo <span class="badge">10 MINS</span></h3></div><div style="font-size:28px">→</div></div><button class="btn btn-g">🇨🇩 SEND TO CONGO TODAY</button></div>

</div>
</div>

<div id="modal" class="modal" onclick="closeModal()">
<div class="modal-box" onclick="event.stopPropagation()">
<h3 id="modalTitle">Order</h3>
<input id="input1" placeholder="Phone +243..." />
<input id="input2" type="number" placeholder="Amount R 1000" style="margin-top:8px" />
<select id="input3" style="margin-top:8px"><option>R100</option><option>R200</option><option>R500</option><option>R1000</option></select>
<button class="btn btn-g" onclick="sendNow()">CONFIRM • 0754665536</button>
<button class="btn" style="background:#eee" onclick="closeModal()">Cancel</button>
</div>
</div>

<script>
var MY_NUMBER="27754665536";
var MY_PIN="1999";
var currentService="";

function checkPin(){
var entered=document.getElementById('pinInput').value;
var msg=document.getElementById('pinMsg');
if(entered==MY_PIN){
localStorage.setItem("tia_logged","yes");
document.getElementById('pinScreen').style.display="none";
}else{
msg.style.display="block";
msg.innerText="Wrong PIN! Your PIN is 1999";
document.getElementById('pinInput').value="";
}
}
function logout(){localStorage.removeItem("tia_logged");location.reload();}
if(localStorage.getItem("tia_logged")=="yes"){document.getElementById('pinScreen').style.display="none";}
document.getElementById('pinInput').addEventListener('keyup',function(e){if(e.key==='Enter') checkPin();});

function openService(s){currentService=s;document.getElementById('modal').style.display="block";document.getElementById('modalTitle').innerText=s.toUpperCase()+" - PIN 1999 Verified";}
function closeModal(){document.getElementById('modal').style.display="none";}
function sendNow(){
var ph=document.getElementById('input1').value;
var amt=document.getElementById('input2').value;
var opt=document.getElementById('input3').value;
if(!ph||!amt){alert("Enter phone and amount");return;}
var orderID="TIA"+Date.now().toString().slice(-6);
var msg="ORDER "+orderID+" - "+currentService.toUpperCase()+"\nTo: "+ph+"\nR"+amt+" "+opt+"\nPIN: 1999 OK\nRef: "+orderID;
window.location.href="https://wa.me/"+MY_NUMBER+"?text="+encodeURIComponent(msg);
}
</script>
</body>
</html>
